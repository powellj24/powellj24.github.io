<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video for Hertz Workshop, 2026</title>
  <link rel="stylesheet" href="jacksonstyle_structure.css?v=4" />
  <link rel="stylesheet" href="jacksonstyle_blue.css?v=4" />
  <link rel="stylesheet" href="mobile-overrides.css?v=10" />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    .timelapse-container {
      max-width: 700px;
      margin: 60px auto;
      padding: 0 24px;
      text-align: center;
    }
    .timelapse-container h1 {
      font-size: 1.3rem;
      margin-bottom: 32px;
    }
    .timelapse-container img {
      max-width: 100%;
      border-radius: 4px;
    }
    .timelapse-container figcaption {
      margin-top: 16px;
      font-size: 0.9rem;
      line-height: 1.6;
      text-align: left;
      color: inherit;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="timelapse-container">
    <h1>Video for Hertz Workshop, 2026</h1>
    <figure>
      <img src="images/timelapse_for_hertz.gif" alt="Timelapse of injured neuron and glia in the Song Lab" />
      <figcaption>A timelapse I took in the Song Lab that shows an injured neuron (green) and glia (red). Around the injury site, the glial body appears to expell a large vesicle-like pouch (dubbed an exopher).
        To our knowledge, this has never been observed in glia. However, a similar process has been seen in <em>C. elegans</em> neurons (Melentijevic et al. <em>Nature</em>, 2017).
      </figcaption>
    </figure>
  </div>
</body>
</html>
